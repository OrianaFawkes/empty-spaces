<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efa6c3" />

    <!-- Basic SEO -->
    <meta
      name="description"
      content="A creative developer's little corner of the internet."
    />

    <title>Empty Spaces</title>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons (TODO: enable once the files exist) -->
    <!--
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    -->

    <!-- Open Graph: social sharing -->
    <!-- TODO: enable once og-image.png and the public URL are ready. -->
    <!--
    <meta property="og:type" content="website">
    <meta property="og:title" content="Empty Spaces">
    <meta property="og:description" content="A creative developer's little corner of the internet.">

    -->

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />

    <!-- JavaScript -->
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="intro-screen" aria-hidden="true">
        <div class="intro-content">
          <p class="intro-title">EMPTY SPACES</p>
          <div class="intro-character">
            <span>ORI</span>
            <span>CHARACTER PLACEHOLDER</span>
          </div>
          <!-- Future Ori sprite:
            <img
                class="intro-character"
                src="assets/images/ori.png"
                alt=""
            >
-->
        </div>
      </div>
      <header class="site-header">
        <a class="site-brand" href="#home" aria-label="Empty Spaces home">
          EMPTY SPACES<span class="brand-period">.</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#home">Home</a>
          <a href="#projects">Projects</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </nav>
      </header>
      <main id="main-content">
        <!-- Home -->
        <section id="home" class="hero">
          <div class="hero-content">
            <p class="hero-eyebrow" data-site="hero.eyebrow"></p>

            <h1 data-site="hero.title"></h1>

            <p class="hero-description" data-site="hero.description"></p>

            <div class="hero-actions">
              <a
                class="button button-primary"
                data-site="hero.primaryAction"
              ></a>

              <a
                class="button button-secondary"
                data-site="hero.secondaryAction"
              ></a>
            </div>
          </div>

          <div class="hero-visual">
            <div class="character-placeholder">
              <span>ORI</span>
              <span>CHARACTER ART GOES HERE</span>
            </div>
          </div>
        </section>
        <!-- Projects -->
        <section id="projects" class="content-section">
          <div class="section-heading">
            <p class="section-eyebrow">WHAT I'VE BEEN MAKING</p>
            <h2>Projects<span class="heading-period">.</span></h2>
            <p>A collection of projects, experiments, and things I've built.</p>
          </div>

          <div class="project-grid" id="project-grid">
            <p class="content-loading">Loading projects...</p>
          </div>
        </section>
        <!-- About -->
        <section id="about" class="content-section about-section">
          <div class="section-heading">
            <p class="section-eyebrow" data-site="about.eyebrow"></p>
            <h2 data-site="about.title"></h2>
          </div>

          <div class="about-content">
            <div class="about-intro">
              <h3 data-site="about.intro"></h3>
            </div>

            <div class="about-description" data-about-paragraphs></div>
          </div>
        </section>
        <!-- Contact -->
        <section id="contact" class="content-section contact-section">
          <div class="contact-content">
            <p class="section-eyebrow" data-site="contact.eyebrow"></p>
            <h2 data-site="contact.title"></h2>
            <p data-site="contact.description"></p>

            <a class="button button-primary" data-site="contact.email"></a>
          </div>
        </section>
        <footer class="site-footer">
          <p>Made with care in Empty Spaces.</p>

          <div id="social-links" class="social-links"></div>

          <p>© <span id="current-year">2026</span> Empty Spaces</p>
        </footer>
      </main>
    </div>
  </body>
</html>
